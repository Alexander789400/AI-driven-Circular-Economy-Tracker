<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Driven-Circular-Economy-Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('/static/images.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: rgba(255,255,255,0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #444;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .results {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI-Driven-Circular-Economy-Tracker</h1>
        <form method="POST">
            {% for i in range(1, 10) %}
                <input type="text" name="feature{{i}}" placeholder="Feature {{i}}" required>
            {% endfor %}
            <select name="sector" required>
                <option value="" disabled selected>Select Sector</option>
                {% for sector in sectors %}
                    <option value="{{ sector }}">{{ sector }}</option>
                {% endfor %}
            </select>
            <button type="submit">Predict</button>
        </form>

        {% if details %}
        <div class="results">
            <h3>Prediction Details</h3>
            <p><strong>Classification value:</strong> {{ details['Classification (Sector)'] }}</p>
            <p><strong>Regression Value:</strong> {{ details['Regression (Predicted Value)'] }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
